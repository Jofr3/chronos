name = "chronos-backend"
main = "src/index.ts"
compatibility_date = "2025-11-24"

[vars]
JWT_SECRET = "dev-secret-change-in-production"

[[d1_databases]]
binding = "DB"
database_name = "chronos-database"
database_id = "c2ac623f-5a57-4c1e-9d01-731a4ab8f97f"

[ai]
binding = "AI"
remote = true

[env.development]
[env.development.vars]
JWT_SECRET = "dev-secret-change-in-production"

[[env.development.d1_databases]]
binding = "DB"
database_name = "chronos-database-development"
database_id = "c2ac623f-5a57-4c1e-9d01-731a4ab8f97f"
remote = false

[env.development.ai]
binding = "AI"
remote = true

[env.preview]
[env.preview.vars]
JWT_SECRET = "preview-secret-change-in-production"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "chronos-database-preview"
database_id = "2659ab56-6f7a-41e8-9073-8e7436a9c46f"

[env.preview.ai]
binding = "AI"
remote = true
